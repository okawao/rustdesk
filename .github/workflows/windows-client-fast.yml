name: Windows, Linux and Android Client Fast Build

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: Upload build artifact
        type: boolean
        default: true

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Keep this in sync with flutter-build.yml
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RS_PUB_KEY: "${{ secrets.RS_PUB_KEY }}"
  RENDEZVOUS_SERVER: "${{ secrets.RENDEZVOUS_SERVER }}"
  API_SERVER: "${{ secrets.API_SERVER }}"
  FORCED_FIXED_CONNECTION_PASSWORD: "${{ secrets.FORCED_FIXED_CONNECTION_PASSWORD }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      # This intermediate artifact is required by the client build job even
      # when the final workflow artifact upload is disabled.
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-client:
    name: Build Windows Flutter Client (x64)
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure hbb_common compatibility
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD libs/hbb_common | awk '{print $3}')
          actual=$(git -C libs/hbb_common rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::hbb_common must match the pinned commit $expected; found $actual"
            exit 1
          fi
          for entry in \
            'libs/hbb_common/src/config.rs:decode_permanent_password_h1_from_storage' \
            'libs/base/src/config/keys.rs:OPTION_USE_RAW_TCP_FOR_API' \
            'libs/hbb_common/protos/rendezvous.proto:HttpProxyRequest'; do
            file=${entry%%:*}
            symbol=${entry#*:}
            if ! grep -Fq "$symbol" "$file"; then
              echo "::error::Missing required symbol $symbol in $file"
              exit 1
            fi
          done
          echo "hbb_common commit: $actual"

      - name: Inject custom server settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDEZVOUS_SERVER:-}" ] || [ -z "${RS_PUB_KEY:-}" ]; then
            echo "RENDEZVOUS_SERVER and RS_PUB_KEY must be configured in GitHub Secrets."
            exit 1
          fi
          echo "::add-mask::${RENDEZVOUS_SERVER}"
          echo "::add-mask::${RS_PUB_KEY}"
          if [ -n "${API_SERVER:-}" ]; then
            echo "::add-mask::${API_SERVER}"
          fi
          if [ -n "${FORCED_FIXED_CONNECTION_PASSWORD:-}" ]; then
            echo "::add-mask::${FORCED_FIXED_CONNECTION_PASSWORD}"
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import re

          rendezvous = os.environ["RENDEZVOUS_SERVER"].strip()
          pubkey = os.environ["RS_PUB_KEY"].strip()
          api = os.environ.get("API_SERVER", "").strip()

          config_path = pathlib.Path("libs/hbb_common/src/config.rs")
          content = config_path.read_text(encoding="utf-8")
          content_new = re.sub(
              r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{rendezvous}"];',
              content,
              count=1,
          )
          content_new = re.sub(
              r'pub const RS_PUB_KEY: &str = ".*?";',
              f'pub const RS_PUB_KEY: &str = "{pubkey}";',
              content_new,
              count=1,
          )
          if content_new == content:
              raise SystemExit("Failed to inject RENDEZVOUS_SERVER/RS_PUB_KEY into config.rs")
          config_path.write_text(content_new, encoding="utf-8")

          if api:
              common_path = pathlib.Path("src/common.rs")
              common = common_path.read_text(encoding="utf-8")
              common_new = common.replace(
                  '"https://admin.rustdesk.com".to_owned()',
                  f'"{api}".to_owned()',
                  1,
              )
              if common_new == common:
                  raise SystemExit("Failed to inject API_SERVER into src/common.rs")
              common_path.write_text(common_new, encoding="utf-8")
          PY

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-quick

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build rustdesk windows flutter client
        shell: pwsh
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          Move-Item -Force ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Add virtual display driver files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive -Path usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path .\usbmmidd_v2\Win32 -Recurse -Force
          Remove-Item -Path .\usbmmidd_v2\deviceinstaller64.exe, .\usbmmidd_v2\deviceinstaller.exe, .\usbmmidd_v2\usbmmidd.bat -Force -ErrorAction SilentlyContinue
          Move-Item -Force .\usbmmidd_v2 .\rustdesk
          if (!(Test-Path .\rustdesk\usbmmidd_v2\usbmmIdd.inf)) {
            throw "Missing .\rustdesk\usbmmidd_v2\usbmmIdd.inf"
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: ./rustdesk

      - name: Verify privacy mode resources
        shell: pwsh
        run: |
          if (!(Test-Path .\rustdesk\WindowInjection.dll)) {
            throw "Missing .\rustdesk\WindowInjection.dll"
          }
          if (!(Test-Path .\rustdesk\usbmmidd_v2\usbmmIdd.inf)) {
            throw "Missing .\rustdesk\usbmmidd_v2\usbmmIdd.inf"
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-windows-client-x64.exe

      - name: Upload windows client artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-windows-client-x64
          path: |
            rustdesk
            SignOutput/rustdesk-windows-client-x64.exe

  build-linux-client:
    name: Build Linux Flutter Client (x64)
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure hbb_common compatibility
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD libs/hbb_common | awk '{print $3}')
          actual=$(git -C libs/hbb_common rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::hbb_common must match the pinned commit $expected; found $actual"
            exit 1
          fi
          for entry in \
            'libs/hbb_common/src/config.rs:decode_permanent_password_h1_from_storage' \
            'libs/base/src/config/keys.rs:OPTION_USE_RAW_TCP_FOR_API' \
            'libs/hbb_common/protos/rendezvous.proto:HttpProxyRequest'; do
            file=${entry%%:*}
            symbol=${entry#*:}
            if ! grep -Fq "$symbol" "$file"; then
              echo "::error::Missing required symbol $symbol in $file"
              exit 1
            fi
          done
          echo "hbb_common commit: $actual"

      - name: Inject custom server settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDEZVOUS_SERVER:-}" ] || [ -z "${RS_PUB_KEY:-}" ]; then
            echo "RENDEZVOUS_SERVER and RS_PUB_KEY must be configured in GitHub Secrets."
            exit 1
          fi
          echo "::add-mask::${RENDEZVOUS_SERVER}"
          echo "::add-mask::${RS_PUB_KEY}"
          if [ -n "${API_SERVER:-}" ]; then
            echo "::add-mask::${API_SERVER}"
          fi
          if [ -n "${FORCED_FIXED_CONNECTION_PASSWORD:-}" ]; then
            echo "::add-mask::${FORCED_FIXED_CONNECTION_PASSWORD}"
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import re

          rendezvous = os.environ["RENDEZVOUS_SERVER"].strip()
          pubkey = os.environ["RS_PUB_KEY"].strip()
          api = os.environ.get("API_SERVER", "").strip()

          config_path = pathlib.Path("libs/hbb_common/src/config.rs")
          content = config_path.read_text(encoding="utf-8")
          content_new = re.sub(
              r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{rendezvous}"];',
              content,
              count=1,
          )
          content_new = re.sub(
              r'pub const RS_PUB_KEY: &str = ".*?";',
              f'pub const RS_PUB_KEY: &str = "{pubkey}";',
              content_new,
              count=1,
          )
          if content_new == content:
              raise SystemExit("Failed to inject RENDEZVOUS_SERVER/RS_PUB_KEY into config.rs")
          config_path.write_text(content_new, encoding="utf-8")

          if api:
              common_path = pathlib.Path("src/common.rs")
              common = common_path.read_text(encoding="utf-8")
              common_new = common.replace(
                  '"https://admin.rustdesk.com".to_owned()',
                  f'"{api}".to_owned()',
                  1,
              )
              if common_new == common:
                  raise SystemExit("Failed to inject API_SERVER into src/common.rs")
              common_path.write_text(common_new, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake curl git libayatana-appindicator3-dev \
            libasound2-dev libclang-dev libdbus-1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev \
            libpulse-dev libssl-dev libva-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            llvm-dev nasm ninja-build pkg-config python3 unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: linux-quick

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          if [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]]; then
            git -C "$(dirname "$(dirname "$(command -v flutter)")")" apply \
              "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build Linux client and Debian package
        env:
          DEB_ARCH: amd64
          CARGO_INCREMENTAL: "0"
        run: |
          # Match the Linux release workflow: only the shared Rust library is needed.
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste
          test -x flutter/build/linux/x64/release/bundle/rustdesk
          mkdir -p dist
          cp rustdesk-*.deb dist/
          # Preserve executable permissions and keep the required libraries and assets.
          tar -czf dist/rustdesk-linux-x64.tar.gz \
            -C flutter/build/linux/x64/release/bundle .

      - name: Upload Linux client artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-client-x64
          path: dist/*
          if-no-files-found: error

  build-android-client:
    name: Build Android APK (${{ matrix.job.abi }})
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - abi: arm64-v8a
            target: aarch64-linux-android
            ndk-script: ndk_arm64.sh
            flutter-platform: android-arm64
            ndk-lib-dir: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            ndk-script: ndk_arm.sh
            flutter-platform: android-arm
            ndk-lib-dir: arm-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
            ndk-script: ndk_x64.sh
            flutter-platform: android-x64
            ndk-lib-dir: x86_64-linux-android
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure hbb_common compatibility
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD libs/hbb_common | awk '{print $3}')
          actual=$(git -C libs/hbb_common rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::hbb_common must match the pinned commit $expected; found $actual"
            exit 1
          fi
          for entry in \
            'libs/hbb_common/src/config.rs:decode_permanent_password_h1_from_storage' \
            'libs/base/src/config/keys.rs:OPTION_USE_RAW_TCP_FOR_API' \
            'libs/hbb_common/protos/rendezvous.proto:HttpProxyRequest'; do
            file=${entry%%:*}
            symbol=${entry#*:}
            if ! grep -Fq "$symbol" "$file"; then
              echo "::error::Missing required symbol $symbol in $file"
              exit 1
            fi
          done
          echo "hbb_common commit: $actual"

      - name: Inject custom server settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDEZVOUS_SERVER:-}" ] || [ -z "${RS_PUB_KEY:-}" ]; then
            echo "RENDEZVOUS_SERVER and RS_PUB_KEY must be configured in GitHub Secrets."
            exit 1
          fi
          echo "::add-mask::${RENDEZVOUS_SERVER}"
          echo "::add-mask::${RS_PUB_KEY}"
          if [ -n "${API_SERVER:-}" ]; then
            echo "::add-mask::${API_SERVER}"
          fi
          if [ -n "${FORCED_FIXED_CONNECTION_PASSWORD:-}" ]; then
            echo "::add-mask::${FORCED_FIXED_CONNECTION_PASSWORD}"
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import re

          rendezvous = os.environ["RENDEZVOUS_SERVER"].strip()
          pubkey = os.environ["RS_PUB_KEY"].strip()
          api = os.environ.get("API_SERVER", "").strip()

          config_path = pathlib.Path("libs/hbb_common/src/config.rs")
          content = config_path.read_text(encoding="utf-8")
          content_new = re.sub(
              r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{rendezvous}"];',
              content,
              count=1,
          )
          content_new = re.sub(
              r'pub const RS_PUB_KEY: &str = ".*?";',
              f'pub const RS_PUB_KEY: &str = "{pubkey}";',
              content_new,
              count=1,
          )
          if content_new == content:
              raise SystemExit("Failed to inject RENDEZVOUS_SERVER/RS_PUB_KEY into config.rs")
          config_path.write_text(content_new, encoding="utf-8")

          if api:
              common_path = pathlib.Path("src/common.rs")
              common = common_path.read_text(encoding="utf-8")
              common_new = common.replace(
                  '"https://admin.rustdesk.com".to_owned()',
                  f'"{api}".to_owned()',
                  1,
              )
              if common_new == common:
                  raise SystemExit("Failed to inject API_SERVER into src/common.rs")
              common_path.write_text(common_new, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          if [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]]; then
            git -C "$(dirname "$(dirname "$(command -v flutter)")")" apply \
              "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-quick
          key: ${{ matrix.job.target }}

      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked
          ./flutter/${{ matrix.job.ndk-script }}
          mkdir -p "flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}"
          cp "target/${{ matrix.job.target }}/release/liblibrustdesk.so" \
            "flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so"
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndk-lib-dir }}/libc++_shared.so" \
            "flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/"

      - name: Build APK
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' flutter/android/gradle.properties
          # A debug signature keeps the APK installable without release signing secrets.
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' flutter/android/app/build.gradle
          pushd flutter
          flutter build apk --release --target-platform "${{ matrix.job.flutter-platform }}" --split-per-abi
          popd
          mkdir -p dist
          cp "flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk" \
            "dist/rustdesk-android-${{ matrix.job.abi }}.apk"

      - name: Setup signing tool version
        if: env.ANDROID_SIGNING_KEY != ''
        run: |
          build_tool_version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$build_tool_version" >> "$GITHUB_ENV"

      - name: Sign APK with release key
        if: env.ANDROID_SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign-rustdesk
        with:
          releaseDirectory: ./dist
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload Android APK artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-${{ matrix.job.abi }}
          path: ${{ steps.sign-rustdesk.outputs.signedReleaseFile || format('dist/rustdesk-android-{0}.apk', matrix.job.abi) }}
          if-no-files-found: error
